<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>JS For Beginners</title>
    <link rel="stylesheet" href="styles.css">
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <img src="logo.svg" alt="SKLD logo">
        
      </header>
      <div class="Title">
        <h1>Wetin you wan see for sky today?</h1>
      </div>

      <form class="SearchBar">
        <div class="Search-container">
        <i class="fa-solid fa-magnifying-glass" id="SearchIcon"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Search For a Place..."
            class="search-input"
          />
        </div>
        
            <button type="submit" id = "SearchBtn" class="Search-Btn">Search</button>
        
      </form>
      
      <div id="ForecastContainer" class="forecast-container">
        
        <div class="card-container">
       
      <div id="Weathercard" class="card">
       
      </div>

       <div id="forecastsection" class="forecast-section">
        
       
           
        </div>

        <div class="daily-forecast-text">
            <p>Daily Forecast</p>
        </div>

        <div id="dailyForecast" class="daily-forecast">
          
             


        


        </div>
        </div>

        <div id="HourlyForecast" class="hourly-forecast">
          <div id="filterGroup" class="filter-group">
          <div class="hourly-forecast-text"><h3>Hourly Forecast</h3></div>  

        <div >
         
        <select id="forecastFilter" class="forecast-filter">
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
          <option Value="Sunday">Sunday</option>
        </select>
      </div> 

       </div> 
       
       <div id="timeTempContainer" class="time-temp-container">

        
        
        

       </div>

       </div>
      
       


      

      

      </div>
      <div id="emptyState" class="empty-state">
        <i class="fa-solid fa-cloud"></i>
        <h3>No forecast</h3>
        <p>wetin you wan make i put for you?</p>
      </div>

    </div>

    

    <script src="weather.js"></script>
  </body>
</html>
